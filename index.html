<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>月間距離進捗メーター</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#181c23;
    --panel2:#202631;
    --text:#f4f6f8;
    --muted:#9aa4b2;
    --line:#343c49;
    --accent:#5da9ff;
    --good:#44d17a;
    --bad:#ff6666;
    --warn:#f5c451;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    min-height:100vh;
    font-family:
      -apple-system, BlinkMacSystemFont, "Segoe UI",
      "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
    background:linear-gradient(180deg,#0b0d11 0%, #11151b 100%);
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
  }

  .app{
    width:min(980px,100%);
    background:rgba(24,28,35,.96);
    border:1px solid #2b323e;
    border-radius:22px;
    padding:26px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }

  h1{
    margin:0 0 6px;
    font-size:clamp(24px,4vw,36px);
  }

  .subtitle{
    color:var(--muted);
    margin-bottom:24px;
  }

  .inputs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:28px;
  }

  .field{
    background:var(--panel2);
    border:1px solid #303846;
    border-radius:14px;
    padding:14px;
  }

  label{
    display:block;
    color:var(--muted);
    font-size:13px;
    margin-bottom:8px;
  }

  .input-wrap{
    display:flex;
    align-items:center;
    gap:8px;
  }

  input[type="number"]{
    width:100%;
    background:#11151b;
    color:white;
    border:1px solid #384252;
    border-radius:10px;
    padding:12px 14px;
    font-size:20px;
    outline:none;
  }

  input[type="number"]:focus{
    border-color:var(--accent);
  }

  .unit{
    color:var(--muted);
    font-weight:600;
  }

  .section{
    margin-top:22px;
  }

  .section-head{
    display:flex;
    justify-content:space-between;
    gap:16px;
    align-items:flex-end;
    margin-bottom:10px;
  }

  .section-title{
    font-size:15px;
    color:#dbe3ec;
    font-weight:700;
  }

  .section-value{
    font-size:14px;
    color:var(--muted);
    text-align:right;
  }

  .bar{
    height:28px;
    border-radius:999px;
    overflow:hidden;
    background:#0f1319;
    border:1px solid #303846;
    position:relative;
  }

  .fill{
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:0%;
    transition:width .35s ease;
  }

  .time-fill{
    background:linear-gradient(90deg,#5865f2,#5da9ff);
  }

  .distance-fill{
    background:linear-gradient(90deg,#1fa95a,#44d17a);
  }

  .bar-label{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:800;
    letter-spacing:.02em;
    text-shadow:0 1px 2px rgba(0,0,0,.5);
    pointer-events:none;
  }

  .ticks{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:#6f7b8a;
    margin-top:7px;
  }

  .meter{
    margin-top:28px;
    background:#10141a;
    border:1px solid #303846;
    border-radius:16px;
    padding:20px;
  }

  .gap-line{
    position:relative;
    height:16px;
    border-radius:999px;
    background:linear-gradient(
      90deg,
      rgba(255,102,102,.65) 0%,
      rgba(255,102,102,.18) 45%,
      rgba(255,255,255,.15) 50%,
      rgba(68,209,122,.18) 55%,
      rgba(68,209,122,.65) 100%
    );
    margin:18px 0 8px;
  }

  .center-marker{
    position:absolute;
    top:-8px;
    bottom:-8px;
    width:2px;
    left:50%;
    background:#f4f6f8;
    opacity:.7;
  }

  .needle{
    position:absolute;
    top:-9px;
    width:18px;
    height:34px;
    border-radius:8px;
    transform:translateX(-50%);
    background:white;
    box-shadow:0 0 0 3px rgba(255,255,255,.12),
               0 5px 15px rgba(0,0,0,.4);
    transition:left .35s ease, background .35s ease;
  }

  .gap-scale{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:11px;
  }

  .summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:22px;
  }

  .card{
    background:var(--panel2);
    border:1px solid #303846;
    border-radius:14px;
    padding:14px;
  }

  .card .name{
    color:var(--muted);
    font-size:12px;
    margin-bottom:7px;
  }

  .card .num{
    font-size:22px;
    font-weight:800;
  }

  .status{
    margin-top:18px;
    font-size:20px;
    font-weight:800;
    text-align:center;
    padding:14px;
    border-radius:14px;
    background:#141922;
  }

  .footer{
    margin-top:18px;
    color:#778394;
    font-size:12px;
    line-height:1.7;
  }

  @media (max-width:720px){
    .inputs,.summary{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <h1>月間距離進捗メーター</h1>
  <div class="subtitle">
    月初から月末までの時間進捗と、走行距離の進捗を比較します。
  </div>

  <div class="inputs">
    <div class="field">
      <label for="target">月間目標距離</label>
      <div class="input-wrap">
        <input id="target" type="number" min="1" step="10" value="1500">
        <span class="unit">km</span>
      </div>
    </div>

    <div class="field">
      <label for="current">現在の走行距離</label>
      <div class="input-wrap">
        <input id="current" type="number" min="0" step="1" value="0">
        <span class="unit">km</span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">時間進捗</div>
      <div class="section-value" id="timeText">--</div>
    </div>
    <div class="bar">
      <div class="fill time-fill" id="timeFill"></div>
      <div class="bar-label" id="timePct">0%</div>
    </div>
    <div class="ticks">
      <span id="monthStart">1日</span>
      <span id="monthMid">中間</span>
      <span id="monthEnd">月末</span>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">距離進捗</div>
      <div class="section-value" id="distanceText">--</div>
    </div>
    <div class="bar">
      <div class="fill distance-fill" id="distanceFill"></div>
      <div class="bar-label" id="distancePct">0%</div>
    </div>
    <div class="ticks">
      <span>0 km</span>
      <span id="targetHalf">750 km</span>
      <span id="targetMax">1500 km</span>
    </div>
  </div>

  <div class="meter">
    <div class="section-head">
      <div class="section-title">予定進捗との差</div>
      <div class="section-value" id="gapPctText">0 pt</div>
    </div>

    <div class="gap-line">
      <div class="center-marker"></div>
      <div class="needle" id="needle"></div>
    </div>

    <div class="gap-scale">
      <span>遅れ</span>
      <span>予定通り</span>
      <span>先行</span>
    </div>

    <div class="summary">
      <div class="card">
        <div class="name">今日時点の予定距離</div>
        <div class="num" id="expectedKm">0 km</div>
      </div>
      <div class="card">
        <div class="name">予定との差</div>
        <div class="num" id="gapKm">0 km</div>
      </div>
      <div class="card">
        <div class="name">時間進捗率</div>
        <div class="num" id="timeCard">0%</div>
      </div>
      <div class="card">
        <div class="name">距離進捗率</div>
        <div class="num" id="distanceCard">0%</div>
      </div>
    </div>

    <div class="status" id="status">入力してください</div>
  </div>

  <div class="footer">
    ※ 時間進捗は現在日時を基準に、月初 0:00 から翌月1日 0:00 までを100%として計算します。<br>
    ※ 予定距離 = 月間目標距離 × 時間進捗率。差がプラスなら予定より先行、マイナスなら遅れです。
  </div>
</div>

<script>
  const targetEl = document.getElementById('target');
  const currentEl = document.getElementById('current');

  function clamp(v,min,max){ return Math.min(max,Math.max(min,v)); }

  function update(){
    const now = new Date();
    const y = now.getFullYear();
    const m = now.getMonth();

    const start = new Date(y,m,1,0,0,0,0);
    const end = new Date(y,m+1,1,0,0,0,0);

    const elapsed = now - start;
    const total = end - start;
    const timeRate = clamp(elapsed / total, 0, 1);

    const target = Math.max(1, Number(targetEl.value) || 1);
    const current = Math.max(0, Number(currentEl.value) || 0);

    const distanceRateRaw = current / target;
    const distanceRate = Math.max(0, distanceRateRaw);

    const expected = target * timeRate;
    const gapKm = current - expected;
    const gapRate = distanceRateRaw - timeRate;

    const timePct = timeRate * 100;
    const distancePct = distanceRateRaw * 100;
    const gapPoints = gapRate * 100;

    document.getElementById('timeFill').style.width = timePct + '%';
    document.getElementById('distanceFill').style.width = clamp(distancePct,0,100) + '%';

    document.getElementById('timePct').textContent = timePct.toFixed(1) + '%';
    document.getElementById('distancePct').textContent = distancePct.toFixed(1) + '%';

    const daysInMonth = new Date(y,m+1,0).getDate();
    const currentDay = now.getDate();
    document.getElementById('timeText').textContent =
      `${currentDay}日 / ${daysInMonth}日`;
    document.getElementById('distanceText').textContent =
      `${current.toLocaleString()} / ${target.toLocaleString()} km`;

    document.getElementById('monthStart').textContent = '1日';
    document.getElementById('monthMid').textContent = Math.ceil(daysInMonth/2) + '日';
    document.getElementById('monthEnd').textContent = daysInMonth + '日';

    document.getElementById('targetHalf').textContent =
      (target/2).toLocaleString(undefined,{maximumFractionDigits:0}) + ' km';
    document.getElementById('targetMax').textContent =
      target.toLocaleString() + ' km';

    document.getElementById('expectedKm').textContent =
      expected.toLocaleString(undefined,{maximumFractionDigits:1}) + ' km';

    const gapSign = gapKm >= 0 ? '+' : '';
    document.getElementById('gapKm').textContent =
      gapSign + gapKm.toLocaleString(undefined,{maximumFractionDigits:1}) + ' km';

    document.getElementById('timeCard').textContent = timePct.toFixed(1) + '%';
    document.getElementById('distanceCard').textContent = distancePct.toFixed(1) + '%';

    const ptSign = gapPoints >= 0 ? '+' : '';
    document.getElementById('gapPctText').textContent =
      `${ptSign}${gapPoints.toFixed(1)} pt`;

    // メーターは -50pt ～ +50pt を画面内100%に割り当て
    const normalized = clamp((gapPoints + 50) / 100, 0, 1);
    const needle = document.getElementById('needle');
    needle.style.left = (normalized * 100) + '%';

    const status = document.getElementById('status');

    if (Math.abs(gapPoints) < 1.0){
      status.textContent = `予定通りです（${gapPoints.toFixed(1)} pt）`;
      status.style.color = 'var(--warn)';
      needle.style.background = 'var(--warn)';
    } else if (gapPoints > 0){
      status.textContent =
        `予定より ${Math.abs(gapKm).toFixed(1)} km 先行`;
      status.style.color = 'var(--good)';
      needle.style.background = 'var(--good)';
    } else {
      status.textContent =
        `予定より ${Math.abs(gapKm).toFixed(1)} km 遅れ`;
      status.style.color = 'var(--bad)';
      needle.style.background = 'var(--bad)';
    }
  }

  targetEl.addEventListener('input', update);
  currentEl.addEventListener('input', update);

  update();
  setInterval(update, 60000);
</script>
</body>
</html>
